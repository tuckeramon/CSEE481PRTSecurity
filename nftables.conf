#!/usr/sbin/nft -f
# =============================================================================
# nftables.conf — Bridged Firewall for Raspberry Pi
# Topology: [Wireless AP: wlan0] <--bridge(br0)--> [Internal Switch: eth0]
# =============================================================================

flush ruleset

# =============================================================================
# BRIDGE FAMILY — Filters traffic passing through the bridge (Layer 2)
# This is the primary firewall for AP <-> switch traffic
# =============================================================================
table bridge filter {

    # -------------------------------------------------------------------------
    # Allowed inbound TCP ports from the wireless (AP) side
    # -------------------------------------------------------------------------
    set allowed_tcp_from_wlan {
        type inet_service
        flags interval
        elements = {
            80,     # HTTP
            443,    # HTTPS
            53,     # DNS (if DNS is handled downstream)
            123,    # NTP
            587,    # SMTP submission (optional)
        }
    }

    # -------------------------------------------------------------------------
    # Allowed inbound UDP ports from the wireless (AP) side
    # -------------------------------------------------------------------------
    set allowed_udp_from_wlan {
        type inet_service
        flags interval
        elements = {
            53,     # DNS
            123,    # NTP
            67, 68, # DHCP (if DHCP server is on the internal network)
        }
    }

    # -------------------------------------------------------------------------
    # MAC addresses explicitly blocked from the AP side (blacklist)
    # Add rogue/abusive clients here
    # -------------------------------------------------------------------------
    set blocked_macs {
        type ether_addr
        flags dynamic
        # elements = { aa:bb:cc:dd:ee:ff }
    }

    # -------------------------------------------------------------------------
    # FORWARD chain — traffic passing through the bridge
    # -------------------------------------------------------------------------
    chain forward {
        type filter hook forward priority filter; policy drop;

        # Allow established/related connections (stateful) — uses ct in bridge
        ct state established,related accept

        # Drop invalid state packets
        ct state invalid drop

        # Drop blocked MAC addresses from wireless side
        iifname "wlan0" ether saddr @blocked_macs drop \
            comment "Blocked wireless clients"

        # --- wlan0 → eth0 (Wireless to internal network) ---

        # Allow DHCP discovery from wireless clients (broadcast, pre-IP)
        iifname "wlan0" oifname "eth0" \
            ether type ip udp dport 67 accept \
            comment "DHCP request from wireless clients"

        # Allow ARP through the bridge
        iifname "wlan0" oifname "eth0" ether type arp accept
        iifname "eth0" oifname "wlan0" ether type arp accept

        # Allow DNS from wireless clients
        iifname "wlan0" oifname "eth0" \
            ip protocol udp udp dport 53 accept
        iifname "wlan0" oifname "eth0" \
            ip protocol tcp tcp dport 53 accept

        # Allow permitted TCP traffic from wireless side
        iifname "wlan0" oifname "eth0" \
            ip protocol tcp tcp dport @allowed_tcp_from_wlan accept

        # Allow permitted UDP traffic from wireless side
        iifname "wlan0" oifname "eth0" \
            ip protocol udp udp dport @allowed_udp_from_wlan accept

        # --- eth0 → wlan0 (Internal network to wireless clients) ---
        # Be more permissive returning to wireless clients (already filtered above)
        iifname "eth0" oifname "wlan0" accept \
            comment "Allow all traffic from trusted side to wireless"

        # --- Rate limit and log drops from wireless side ---
        iifname "wlan0" limit rate 5/minute \
            log prefix "[nft-bridge-drop] " flags all drop
        iifname "wlan0" drop
    }

    # -------------------------------------------------------------------------
    # INPUT chain — traffic destined FOR the bridge device itself (br0)
    # (e.g., management access to the Pi from a bridged host)
    # -------------------------------------------------------------------------
    chain input {
        type filter hook input priority filter; policy drop;

        ct state established,related accept
        ct state invalid drop

        # Allow from trusted (internal) side only
        iifname "eth0" accept \
            comment "Full access from internal switch side"

        # Allow limited management from wireless side (SSH, adjust as needed)
        # Uncomment and restrict to specific IPs for tighter control:
        # iifname "wlan0" ip saddr 192.168.x.x/24 tcp dport 22 accept
        iifname "wlan0" tcp dport 22 accept \
            comment "SSH from wireless — restrict to specific IPs in production"

        iifname "wlan0" limit rate 3/minute \
            log prefix "[nft-bridge-input-drop] " flags all
        drop
    }
}

# =============================================================================
# INET FAMILY — Handles any routed traffic on the Pi itself
# (e.g., if the Pi does NAT, routing, or runs local services)
# =============================================================================
table inet firewall {

    chain input {
        type filter hook input priority filter; policy drop;

        # Loopback always allowed
        iifname "lo" accept

        # Established/related
        ct state established,related accept
        ct state invalid drop

        # ICMP — allow ping but rate limit
        ip protocol icmp icmp type { echo-request, echo-reply, \
            destination-unreachable, time-exceeded } \
            limit rate 10/second accept
        ip6 nexthdr icmpv6 accept

        # SSH from internal side only
        iifname "eth0" tcp dport 22 accept
        iifname "br0"  tcp dport 22 accept

        # Drop everything else with rate-limited logging
        limit rate 5/minute log prefix "[nft-inet-input-drop] " flags all
        drop
    }

    chain forward {
        type filter hook forward priority filter; policy drop;
        # Bridge handles L2 forwarding — this chain handles any routed traffic
        # Add NAT/routing rules here if the Pi is also a router
        ct state established,related accept
        ct state invalid drop
    }

    chain output {
        type filter hook output priority filter; policy accept;
        # Permissive outbound from the Pi itself — tighten if needed
    }
}

# =============================================================================
# NOTES / QUICK REFERENCE
# =============================================================================
# Load this config:
#   sudo nft -f /etc/nftables.conf
#
# Check ruleset:
#   sudo nft list ruleset
#
# Monitor logs (drops):
#   sudo journalctl -k -f | grep nft
#
# Enable nftables on boot:
#   sudo systemctl enable nftables
#   sudo systemctl start nftables
#
# IMPORTANT — Enable bridge netfilter in kernel:
#   Add to /etc/sysctl.d/99-bridge-nf.conf:
#     net.bridge.bridge-nf-call-iptables = 1
#     net.bridge.bridge-nf-call-ip6tables = 1
#     net.bridge.bridge-nf-call-arptables = 1
#   Then: sudo sysctl --system
#
#   Also load the kernel module on boot:
#     echo "br_netfilter" | sudo tee /etc/modules-load.d/br_netfilter.conf
#     sudo modprobe br_netfilter
# =============================================================================