#!/usr/sbin/nft -f
# =============================================================================
# nftables.conf — Engineering Workstation Bridge Firewall
#
# Topology:
#   [Engineering Workstation] --wifiAP - eth0-- [Pi Bridge] --eth1-- [OT/ICS Devices]
#
# Trust model:
#   - One known workstation on eth0, pinned by IP + MAC
#   - OT devices on eth1 may push data back to the workstation
#   - Everything else is dropped and logged
# =============================================================================
 
flush ruleset
 
# --- Workstation Values ---
define WS_IP  = 192.168.1.30              # Engineering workstation IP
define WS_MAC = bc-38-98-34-0d-28         # Engineering workstation MAC
 
define OT_NET = 192.168.1.0/24             # OT/ICS device subnet on eth0
define MGMT_IP = 192.168.1.30               # IP you SSH to the Pi from (eth1 side)
 
# --- Studio 5000 / RSLinx / EtherNet/IP required ports ---
#
# TCP 44818 — EtherNet/IP explicit messaging (CIP); required for Studio 5000
#             program upload/download, go online, tag browsing
# TCP 2222  — EtherNet/IP implicit I/O (legacy controllers); also used by
#             RSLinx for some connection types
# UDP 44818 — RSLinx device discovery / Who Active browsing
# UDP 2222  — EtherNet/IP implicit I/O data (cyclic/change-of-state)
# TCP 44818 is the primary port; without it Studio 5000 cannot connect at all.
 
set ics_tcp_ports {
    type inet_service
    flags interval
    elements = {
        80,     # HTTP
        3306,   # mysql database
        44818,  # EtherNet/IP CIP — Studio 5000 primary connection port
        2222,   # EtherNet/IP implicit messaging (legacy / some I/O modules)
    }
}
 
set ics_udp_ports {
    type inet_service
    flags interval
    elements = {
        68,     # dhcpc
        161,    # snmp
        44818,  # RSLinx Who Active / device discovery (UDP broadcast)
        2222,   # EtherNet/IP I/O data (cyclic updates from PLC to workstation)
    }
}
 
# =============================================================================
table bridge filter {
 
    chain forward {
        type filter hook forward priority filter; policy drop;
 
        # Stateful: allow return traffic for established sessions
        ct state established,related accept
        ct state invalid drop
 
        # ARP must pass or the workstation can't resolve device IPs
        ether type arp accept
 
        # --- Workstation → OT devices ---
        # Pin by both IP and MAC so a rogue device can't spoof the workstation.
        iifname "eth0" \
            ether saddr $WS_MAC \
            ip saddr $WS_IP \
            ip daddr $OT_NET \
            ip protocol tcp tcp dport @ics_tcp_ports \
            accept
 
        iifname "eth0" \
            ether saddr $WS_MAC \
            ip saddr $WS_IP \
            ip daddr $OT_NET \
            ip protocol udp udp dport @ics_udp_ports \
            accept
 
        # --- OT devices → Workstation (server-initiated push) ---
        # OT side can only talk back to the one workstation IP.
        iifname "eth1" \
            ip saddr $OT_NET \
            ip daddr $WS_IP \
            ip protocol tcp tcp dport @ics_tcp_ports \
            accept
 
        iifname "eth1" \
            ip saddr $OT_NET \
            ip daddr $WS_IP \
            ip protocol udp udp dport @ics_udp_ports \
            accept
 
        # --- ICMP: allow ping between workstation and OT, rate-limited ---
        iifname "eth0" ip saddr $WS_IP \
            ip protocol icmp icmp type echo-request \
            limit rate 5/second accept
 
        iifname "eth1" ip daddr $WS_IP \
            ip protocol icmp icmp type { echo-request, echo-reply } \
            limit rate 5/second accept
 
        # Block ICMP redirect — MITM risk in OT environments
        ip protocol icmp icmp type redirect drop
 
        # --- Log and drop everything else ---
        limit rate 10/minute log prefix "[bridge-drop] " flags all
        drop
    }
 
    # Management: SSH to the Pi itself, from internal OT side only
    chain input {
        type filter hook input priority filter; policy drop;
 
        iifname "lo" accept
        ct state established,related accept
        ct state invalid drop
 
        iifname "eth1" ip saddr $MGMT_IP tcp dport 22 accept
 
        limit rate 5/minute log prefix "[bridge-input-drop] " flags all
        drop
    }
}
 
# =============================================================================
# Setup:
#
# Enable bridge netfilter (required or rules silently do nothing):
#   echo "br_netfilter" | sudo tee /etc/modules-load.d/br_netfilter.conf
#   sudo modprobe br_netfilter
#
# Add to /etc/sysctl.d/99-bridge-nf.conf:
#   net.bridge.bridge-nf-call-iptables  = 1
#   net.bridge.bridge-nf-call-ip6tables = 1
#   net.ipv4.conf.all.send_redirects    = 0
#   net.ipv4.conf.all.accept_redirects  = 0
#
# Test config without applying:
#   sudo nft -c -f /etc/nftables.conf
#
# Apply:
#   sudo nft -f /etc/nftables.conf
#   sudo systemctl enable --now nftables
#
# Watch drops live:
#   sudo journalctl -k -f | grep bridge-drop
# =============================================================================